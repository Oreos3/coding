[project]
name = "nqbt"
version = "0.1.0"
description = "Conservative bar-by-bar backtester for CME NQ / MNQ futures"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["nqbt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
